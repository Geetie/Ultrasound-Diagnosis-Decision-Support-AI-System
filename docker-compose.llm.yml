services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: ultrasound-vllm
    command: >
      --model Qwen/Qwen2.5-1.5B-Instruct
      --served-model-name Qwen2.5-1.5B-Instruct
      --host 0.0.0.0
      --port 8002
      --gpu-memory-utilization 0.80
      --max-model-len 2048
      --dtype auto
    ports:
      - "8002:8002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - ultrasound-network

  llama-cpp:
    build:
      context: .
      dockerfile: Dockerfile.llama-cpp
    container_name: ultrasound-llama-cpp
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models:ro
    environment:
      - MODEL_PATH=/models/qwen2.5-1.5b-instruct-q4_k_m.gguf
      - N_CTX=512
      - HOST=0.0.0.0
      - PORT=8001
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ultrasound-network
    deploy:
      resources:
        limits:
          memory: 4G

networks:
  ultrasound-network:
    external: true
