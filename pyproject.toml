[tool.coverage.run]
source = ["app"]
branch = true
# 与业务无关或无法在单测中执行的分支（真机/外部服务）排除
omit = [
    "app/main.py",
    "*/__init__.py",
    "app/static/*",
    "app/templates/*",
]

[tool.coverage.report]
# T-G1-INT-01 目标：整体 ≥80%，核心模块 ≥90%。
# 棘轮记录（只进不退，每轮按实测上调，并留出环境波动余量）：
#   整体：76% -> 78%（实测 78.26% -> 79.08%，余量仅 0.08pt，本轮**不**上调以免门禁 flaky）
#   核心：75% -> 76% -> 78%（实测 77.06% -> 78.22%）
# 达标情况：整体距 80% 还差约 0.92pt（约 +230 语句）；核心距 90% 还差约 11.78pt。
# 缺口最大的模块（按缺失行数排序，来自 coverage.json 实测，已排除本轮补完项）：
#   app/inference/gpu_monitor.py(52.5%/538)、app/security/desensitization_restore.py(44.6%/303)、
#   app/services/safety_gateway_client.py(35.0%/211)、app/security/refresh_token.py(77.7%/584)、
#   app/api/websocket/nav.py(67.3%/341)、app/inference/gpu_memory_monitor.py(41.8%/184)、
#   app/security/desensitization.py(64.0%/278)、app/inference/sustained_load_test.py(0%/95)
# 本轮已补完：app/rag/tokenizer_utils.py(0% -> 100%)、app/security/hsm/persistence_manager.py(13.8% -> 高位)
# 覆盖率达到目标后把这里与 CI 的阈值一并提到 80 / 90。
fail_under = 78
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# --dist=loadfile：按文件分发（而非按用例）。本仓库多个测试类存在
# "链式依赖"（前一个用例建立状态、后一个复用，如 SEC 的 HSM 密钥链、
# 全局单例），按用例随机分发会把链条拆到不同 worker 造成假失败。
# 单进程运行时该选项无副作用。
addopts = "--tb=short --no-header --durations=20 -m 'not perf' --dist=loadfile"
markers = [
    "perf: 性能/延迟基准测试（断言墙钟 P99 阈值，并行执行时受 CPU 争抢影响而假失败）。默认排除；需单独串行运行: pytest -m perf -n0",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external services",
    "phase0a: marks tests as Phase0A Gate 0A-Tech-P0 verification tests",
    "requires_llm: marks tests that require real LLM services (set LLM_TEST_MODE=local to enable)",
    "gate_criteria: marks tests that enforce Gate 0A pass criteria (FAILED=FAILED, not silently passed)",
    "track_inf: INF 基础设施轨道 (Docker/PG/Redis/配置/GPU)",
    "track_sec: SEC 安全合规轨道 (JWT/脱敏/HSM/同意/Token/审计)",
    "track_data: DATA 数据轨道 (UDT/知识库/数据保留)",
    "track_llm: LLM 推理轨道 (InferenceEngine/vLLM/llama.cpp/一致性)",
    "track_emb: EMB 嵌入轨道 (Ultrasound-CLIP/BGE-M3/向量)",
    "track_obs: OBS 可观测性轨道 (日志/指标/监控/追踪)",
    "track_sg: SG 安全网关轨道 (校验/降级/熔断/同意检查)",
    "track_api: API 接口轨道 (FastAPI/诊断/WebSocket/DICOM)",
    "track_fus: FUS 融合层轨道 (冲突检测/Self-RAG/LLM脱敏增强)",
    "track_agt: AGT 智能体轨道 (中央调度/知识查询/流程监控)",
    "track_rag: RAG 检索轨道 (查询增强/多模态检索/精排)",
    "track_edg: EDG 边缘端轨道 (DICOM SCP/TensorRT/语音)",
    "sustained_run: 长时间持续运行测试(需手动启用,设置SUSTAINED_RUN_ENABLED=1)",
    "track_int: INT 集成轨道 (端到端/安全流程/合规验证)",
    "track_doc: DOC 文档轨道 (配置一致性/术语一致性)",
    "sec_speed_fast: SEC快速测试 (<0.1s)",
    "sec_speed_normal: SEC正常测试 (0.1s-1s)",
    "sec_speed_slow: SEC慢速测试 (>1s)",
    "sec_domain_auth: SEC认证域 (JWT/密码/角色权限)",
    "sec_domain_hsm: SEC HSM域 (密钥管理/降级/轮换)",
    "sec_domain_desens: SEC脱敏域 (三层脱敏/还原/规则)",
    "sec_domain_consent: SEC同意域 (患者同意/撤回/广播)",
    "sec_domain_token: SEC令牌域 (RefreshToken/TokenFamily/Redis存储)",
    "sec_domain_audit: SEC审计域 (审计链/日志/哈希)",
    "sec_domain_sg: SEC安全网关域 (校验/降级/熔断/P99)",
    "sec_critical: SEC安全关键路径测试",
    "sec_regression: SEC回归测试",
    "debug_pro_1_0_0: marks tests for debug-pro-1.0.0 compliance verification (真实临床场景/器官特异标记/端到端管线)",
]
