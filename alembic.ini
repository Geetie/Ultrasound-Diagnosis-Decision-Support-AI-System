[alembic]
script_location = alembic
sqlalchemy.url =

[post_write_hooks]
hooks =
hook_type = console_scripts
hook = alembic_autogenerate_enums

# ---------------------------------------------------------------------------
# 日志配置段（2026-09-28 修复）
#
# 原文件只有 [alembic]/[post_write_hooks]/[logger_alembic] 三个段，缺少
# logging.config.fileConfig 必需的 [loggers]/[handlers]/[formatters]；
# 于是 alembic/env.py 的 fileConfig(config.config_file_name) 必然抛
# `KeyError: 'formatters'` —— **`alembic upgrade head` 在任何环境都会失败**，
# 8 个迁移文件因此从未真正被应用过（单测用 SQLAlchemy metadata 建表，掩盖了这一点）。
# 现场部署时被真实数据库暴露出来，此处补齐标准三段结构。
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
