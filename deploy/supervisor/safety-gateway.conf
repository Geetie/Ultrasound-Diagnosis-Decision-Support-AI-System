[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:safety-gateway]
command=uvicorn safety_gateway.main:app --host 0.0.0.0 --port 9001 --workers 1
directory=/app
user=sguser
autostart=true
autorestart=true
startsecs=2
startretries=100
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/var/log/supervisor/safety-gateway-stdout.log
stderr_logfile=/var/log/supervisor/safety-gateway-stderr.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=HOME="/app",USER="sguser"

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
