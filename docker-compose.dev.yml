services:
  postgres:
    image: ankane/pgvector:latest
    container_name: ultrasound-postgres
    environment:
      POSTGRES_DB: ultrasound_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ultrasound_db"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ultrasound-network
    oom_score_adj: -900
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7.2-alpine
    container_name: ultrasound-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ultrasound-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    oom_score_adj: -500
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--save"
      - "60"
      - "1"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      - "--maxmemory"
      - "400mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--slowlog-log-slower-than"
      - "10000"       

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ultrasound-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:${POSTGRES_PASSWORD}@postgres:5432/ultrasound_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENV=development
    volumes:
      - .:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      safety-gateway:
        condition: service_healthy
    networks:
      - ultrasound-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

  safety-gateway:
    build:
      context: .
      dockerfile: Dockerfile.safety-gateway.dev
    container_name: ultrasound-safety-gateway
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:${POSTGRES_PASSWORD}@postgres:5432/ultrasound_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - SAFETY_GATEWAY_HOST=0.0.0.0
      - SAFETY_GATEWAY_PORT=9001
      - ENV=development
    volumes:
      - .:/app
      - /app/__pycache__
    ports:
      - "9001:9001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ultrasound-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9001/health || exit 1"]     
      interval: 4s
      timeout: 1s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    oom_score_adj: -1000

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.93.0
    container_name: ultrasound-victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - vmdata:/victoria-metrics-data
    networks:
      - ultrasound-network
    oom_score_adj: -500
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 200M
        reservations:
          cpus: '0.1'
          memory: 50M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ultrasound-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - ultrasound-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M

  vmbackup:
    image: victoriametrics/vmbackup:v1.93.0
    container_name: ultrasound-vmbackup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if /vmbackup-prod \
            -storageDataPath=/victoria-metrics-data \
            -dst=file:///backup/$$(date +%Y%m%d_%H%M) \
            -snapshot.createURL=http://victoriametrics:8428/snapshot/create \
            2>&1; then
            echo "backup_success $$(date)"
          else
            echo "backup_failed $$(date)"
            wget -qO- --post-data='{"type":"vmbackup_failure","message":"VictoriaMetrics hourly backup failed"}' http://api:8000/api/v1/internal/alerts/webhook 2>/dev/null || true
          fi
          find /backup -mindepth 1 -maxdepth 1 -type d -mtime +7 | xargs rm -rf
          sleep 3600
        done
    volumes:
      - vmdata:/victoria-metrics-data:ro
      - vmbackup_data:/backup
    networks:
      - ultrasound-network
    depends_on:
      - victoriametrics
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

volumes:
  postgres_data:
  redis_data:
  vmdata:
  vmbackup_data:

networks:
  ultrasound-network:
    driver: bridge