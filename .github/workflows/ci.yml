name: CI

# 提交即跑：代码规范 + 分轨并行测试 + 前端门禁 + 覆盖率（T-G1-INT-01）
#
# 依赖说明（与本地一致的运行方式）：
#   pytest 必须带 --dist=loadfile（见 pyproject.toml 注释）：本仓库多个测试类
#   存在链式依赖，按用例随机分发会把链条拆到不同 worker 造成假失败。
#   SoftHSM 时间戳隔离由 tests/conftest.py 在导入 app 之前设置，CI 不覆盖。

on:
  push:
    branches: [main, 'feature/**', 'chore/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'
  # 测试期禁用 SoftHSM 与真实外部服务
  USE_SOFT_HSM: 'false'
  ENV: test

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install 'ruff==0.6.9'

      - name: 计算本次改动的 Python 文件
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          FILES=$(git diff --name-only "$BASE" HEAD -- '*.py' 2>/dev/null || true)
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "changed python files:"; echo "$FILES"

      - name: 正确性门禁（仅改动文件：未定义名/重复定义/语法/字面量比较）
        # 即便有债务清单，"新代码引入未定义名/重复定义"这类真实缺陷也必须无条件挡住。
        if: steps.changed.outputs.files != ''
        run: |
          ruff check --select F821,F822,F823,F811,E9,F632 \
            ${{ steps.changed.outputs.files }}

      - name: 全量风格门禁（阻断：债务清单之外的违规一律红）
        # 存量债务登记在 .ruff-debt.txt，由 CLI --ignore 排除；该清单**只减不增**，
        # 计数棘轮由 tests/unit/quality/test_ruff_ratchet.py 守卫。
        # 另外排除 RUF100：被 CLI ignore 的规则会让既有 noqa 变成"无用指令"，
        # 这是 ignore 机制本身的副作用，不是代码问题。
        run: |
          set -euo pipefail
          DEBT=$(tr '\n' ',' < .ruff-debt.txt | sed 's/,$//')
          ruff check . --ignore "${DEBT},RUF100" | tee ruff-report.txt

      - name: 分层依赖守卫（import-linter，15-技术升级规划 §4.7）
        # 契约与存量债务登记见 .importlinter；策略与 ruff 债务清单一致（只减不增）。
        run: |
          pip install 'import-linter>=4,<5'
          lint-imports

      - name: 全量风格报告（留存完整存量，供人工对照债务清单）
        continue-on-error: true
        run: ruff check . --statistics > ruff-statistics.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruff-report
          path: |
            ruff-report.txt
            ruff-statistics.txt
          if-no-files-found: ignore

  backend-test:
    name: Backend tests (${{ matrix.track }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: agt-fus
            paths: tests/unit/agt tests/unit/fus tests/integration/agt tests/integration/fus
          - track: sec-sg
            paths: tests/unit/sec tests/unit/sg tests/integration/sg
          - track: rag-emb-data
            paths: tests/unit/rag tests/unit/emb tests/unit/data tests/unit/knowledge tests/integration/rag tests/integration/emb tests/integration/data
          - track: llm-inf-obs
            paths: tests/unit/llm tests/unit/inf tests/unit/obs tests/integration/llm tests/integration/inf
          - track: api-edg-tools
            paths: tests/unit/api tests/unit/edg tests/unit/tools
          - track: integration-int
            paths: tests/integration/int
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run ${{ matrix.track }}
        run: |
          python -m pytest ${{ matrix.paths }} \
            -q --tb=short -p no:cacheprovider \
            -n 4 --dist=loadfile --timeout=300

  rag-eval-gate:
    name: RAG eval gate (caliber + trustworthiness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # 只装标准库即可：门禁刻意做成零第三方依赖，才能在最瘦的环境里跑起来
      # （评估实现的可信度不该依赖"能不能装上一个 500MB 的评测框架"）。
      - name: Caliber guard (all NDCG impls must agree and stay in [0,1])
        run: python scripts/audit/p115_eval_gate.py
      - name: Metric + statistics guards
        run: |
          pip install pytest
          python -m pytest tests/unit/quality/test_retrieval_metrics.py             tests/unit/quality/test_eval_statistics.py             -q --tb=short -p no:cacheprovider --noconftest
      # p117 是「gold 标注一致性」工具，本体要连 DB 查 KB，CI 里跑不了。
      # 但它的**存在理由**与阈值必须被守护 —— 2026-11-09 实测：
      # 我写的 47 条 B2 条目里 74% 的 chunk_id 标错，导致 hit@1 只有 0.11，
      # 且让精排「看起来完全无效」（实际修正后是 +12.8pt）。
      # 这条单测确保：阈值不被悄悄放宽、工具文档里的事故记录不被删除。
      - name: B2 gold uniqueness tool guard (p117)
        run: |
          python -m pytest tests/unit/quality/test_p117_gold_uniqueness.py             -q --tb=short -p no:cacheprovider --noconftest
      # p121（合成数据七道闸）/ p126（数据集版本化与覆盖矩阵）同理：
      # 本体要么调 LLM 要么连 DB，CI 里跑不了。但它们的**判据与阈值必须被守护** ——
      # 2026-11-09 实测：8B 模型在提示词明确写「禁止编造文献名」的情况下，
      # 10 条里仍有 4 条编造（《C-TIRADS 2018》/《LI-RADS 2017》），
      # 加闸后才抓到。若有人把闸放宽或删掉，数据集会静默退化。
      - name: Synthetic data gate + dataset version guards (p121/p126)
        run: |
          python -m pytest tests/unit/quality/test_p121_synth_gate.py             tests/unit/quality/test_p126_dataset_version.py             -q --tb=short -p no:cacheprovider --noconftest
      # p123（context_recall / context_precision）与 p128（B2→Ragas 口径升级）同理：
      # 本体要连 DB 检索，CI 里跑不了；但**口径与推导逻辑必须被守护**。
      #
      # p123 的关键：hit@10=0.7872 但 context_recall=0.3763 —— 只测 hit@k 会以为检索还行。
      #   首轮实现把中文二元组当关键单元，在英文原文上导致 recall 严重低估（0.1194 vs 0.4414）。
      # p128 的关键：**persona 必须标 unassigned 不许伪造**，否则"按 persona 切片"变成假分析。
      - name: Retrieval-caliber guards (p123/p128)
        run: |
          python -m pytest tests/unit/quality/test_p123_context_recall.py             tests/unit/quality/test_p128_b2_upgrade.py             -q --tb=short -p no:cacheprovider --noconftest
      # p79 数据质量四道闸的 kind 分档必须被守护。
      #
      # 2026-11-09 新增 `mixed` 类型：L3 手工集按 persona 分层（resident/attending/
      # clinician/qa 四类），其中 clinician 与 qa 问处置与体系时**本就不该含影像术语**。
      # 该集覆盖率 40.3%，按 `retrieval` 的 50% 门槛会误判 FAIL。
      #
      # 若有人把 mixed 的门槛调到 0.2 以下，「纯患者问诊集」也会通过 —— 闸就失效了。
      # 这条单测把三档门槛钉住：retrieval ≥0.50 / mixed ≥0.30 / plain_language ≤0.40。
      - name: Dataset quality gate kind guards (p79)
        run: |
          python -m pytest tests/unit/quality/test_p79_dataset_quality_gate.py             -q --tb=short -p no:cacheprovider --noconftest

  perf-baseline:
    name: Performance baseline (serial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run perf-marked tests serially
        # 墙钟断言必须串行（-n0）；CI 机器性能波动较大，这里以报告为主。
        run: python -m pytest -m perf -n0 -q --tb=short --timeout=600

      - name: Inline benchmarks（纯函数热路径）
        # scripts/bench_suite.py 的统一入口（T-G1-INT-03）；
        # 真机基准（TensorRT/FunASR）需现场硬件，不在此流水线。
        run: python scripts/bench_suite.py --suite inline --json bench_report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: bench_report.json
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc -b
      - name: Unit tests (vitest)
        run: npm run test:run
      - name: Production build
        run: npm run build

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run full suite with coverage
        run: |
          python -m pytest tests/unit tests/integration/int \
            -q --tb=short -p no:cacheprovider \
            -n 4 --dist=loadfile --timeout=300 \
            --cov=app --cov-report=term-missing --cov-report=xml
      - name: Enforce coverage thresholds
        # Gate 1 目标：整体 ≥80%、核心模块 ≥90%（T-G1-INT-01）。
        # 当前实测基线：整体 76%、核心 75%。这里先按"棘轮"设门——把门设在
        # 实测基线之下一点，保证不倒退，同时不为了凑数字写无意义用例；
        # 达到目标后把下面两个数字提到 80 / 90。
        run: |
          set -e
          echo "::notice::覆盖率目标 整体80%/核心90%；当前实测 整体82.39%/核心86.30%（棘轮门禁 82/86）"
          # 棘轮只进不退：实测值上调后同步收紧，并留约 0.3~0.5pt 环境波动余量
          python -m coverage report --fail-under=82
          python -m coverage report \
            --include='app/security/*,app/services/*,app/fusion/*,app/agents/*' \
            --fail-under=86
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
