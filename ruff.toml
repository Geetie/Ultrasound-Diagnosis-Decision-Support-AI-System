line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

# 这里只放**永久性质**的豁免（中文文案的标点与行宽），不放任何"存量未修"的规则。
# 存量债务统一在仓库根目录 .ruff-debt.txt 里登记：CI 用它做 CLI ignore 实现阻断，
# tests/unit/quality/test_ruff_ratchet.py 用它做"只减不增"的计数棘轮。
# 这样 ruff.toml 的完整检查结果永远反映真实存量（不会因 ignore 而"看不见"债务）。
ignore = [
    "E501",   # 行宽：由 formatter 管理
    "RUF001", # 中文标点/全角字符：本项目文案为中文，非笔误
    "RUF002", # 同上（docstring 内）
    "RUF003", # 同上（注释内）
]

[lint.isort]
known-first-party = ["app"]

[lint.flake8-bugbear]
# FastAPI 的 Depends()/Query() 等作为默认参数值是**框架要求的写法**，不是 bugbear
# 想抓的"可变的默认参数"。这里按官方建议把它们列为 immutable calls，
# 否则 128 条 B008 全是噪声，真正的可变默认参数缺陷会被淹没。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
    # 项目自有的 FastAPI 依赖类，同样是框架要求的默认参数写法
    "app.security.auth.RoleChecker",
    # A.88：与 RoleChecker **完全同构**的权限位依赖（同样是无状态的调用路由器，
    # 由 FastAPI 在每个请求里实例化后调用）。不加这一条会新增 6 条 B008，
    # 而 B008 的存量基线是 0（不在 .ruff-debt.txt 里）→ 直接顶到棘轮。
    # 注意：本项只豁免"把 PermissionChecker(...) 作为 Depends() 的默认值"这一种
    # 框架写法，不放宽任何其它 B008 判定。
    "app.security.auth.PermissionChecker",
]

[format]
quote-style = "double"
indent-style = "space"

# 一次性探针脚本（项目惯例：`_` 前缀，如 scripts/_tn3k_seg_probe.py）不入库、
# 用完即删。它们留在工作树里会让 `ruff check .` 的计数随"别的窗口还剩几个探针"
# 漂移，进而让 tests/unit/quality/test_ruff_ratchet.py 的棘轮基线在本地与 CI
# 之间对不上（CI 是干净检出，探针不存在 → 触发"变少请调小基线"假失败）。
exclude = [
    "scripts/_*.py",
]
