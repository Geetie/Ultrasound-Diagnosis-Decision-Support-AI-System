# Langfuse v3 自托管栈（15 号计划 2.4：LLM 专属可观测旁路）
# 安全：全部端口绑 127.0.0.1（对齐真机"端口只绑回环"规范）
# 端口：web 30100（OTLP: /api/public/otel）
name: langfuse

services:
  # ⚠️ A.61 修复：web 与 worker 是**两个不同的镜像**！
  # 原先两者都用 `langfuse/langfuse:3`，于是"worker"容器实际跑的是 `./web/server.js`
  # （web 入口），**没有任何队列消费者** —— 现象：OTLP 导出返回 200、Redis 里
  # `bull:otel-ingestion-queue:wait` 一直堆积 job，而 ClickHouse `traces` 恒为 0
  # （Langfuse 界面"一条 trace 都没有"）。真机证据：worker 容器 `ps` 显示
  # `node ./web/server.js`，镜像 Cmd 即 web 入口。
  # 官方自托管 compose 的 worker 用 `langfuse/langfuse-worker:3`（自带 worker 入口）。
  langfuse-worker:
    image: ghcr.io/langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on: &langfuse-depends
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      TZ: Asia/Shanghai
      LANGFUSE_WORKER: "true"
      NEXTAUTH_URL: http://127.0.0.1:30100
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DATABASE_URL: postgresql://postgres:${LANGFUSE_PG_PASSWORD}@postgres:5432/langfuse
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_MIGRATION_USER: clickhouse
      CLICKHOUSE_MIGRATION_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_BUCKET: langfuse-media
      LANGFUSE_S3_MEDIA_REGION: auto
      LANGFUSE_S3_MEDIA_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_FORCE_PATH_STYLE: "true"
      # ⚠️ A.61 修复（两处，缺一不可）：Redis 连接串
      #
      # ① **变量名必须是 `REDIS_CONNECTION_STRING`** —— Langfuse v3 镜像的构建产物里
      #    只读这个名（以及 REDIS_HOST/PORT/AUTH 回退），**不读 `REDIS_URL`**；
      #    只设 `REDIS_URL` 时 Redis 客户端等于没配置 → OTLP 摄取队列起不来
      #    （`Failed to instantiate otel ingestion queue`，表现为"每条 trace 导出都被 500 拒、
      #    界面上一条都没有"，而 UI/Postgres 侧完全正常，极难察觉）。
      # ② **URL 里必须带密码** —— redis 服务带 `--requirepass ${REDIS_PASSWORD}`。
      # 两者都在（REDIS_URL 供其它组件/人读），语义一致。
      REDIS_CONNECTION_STRING: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LANGFUSE_ENABLE_OTLP_TRACES: "true"
      # 首启自动初始化 org/project + 固定 API keys（评测管线可脚本化引用）
      LANGFUSE_INIT_ORG_ID: "uai"
      LANGFUSE_INIT_PROJECT_ID: "uai-prod"
      LANGFUSE_INIT_PROJECT_NAME: "超声诊疗决策支持系统"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "pk-lf-uai-prod"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "sk-lf-uai-prod-9f2b7c41e8a3d65f0b18c7a92e4d3f56"

  langfuse-web:
    image: ghcr.io/langfuse/langfuse:3
    restart: unless-stopped
    depends_on: *langfuse-depends
    ports:
      - "127.0.0.1:30100:3000"
    environment:
      <<: *langfuse-env
      LANGFUSE_WORKER: "false"
      LANGFUSE_PORT: "3000"

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_PG_PASSWORD}
      POSTGRES_DB: langfuse
    ports:
      - "127.0.0.1:30432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse /data/langfuse-media && minio server /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:30900:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:30637:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "127.0.0.1:30812:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  clickhouse_data:
